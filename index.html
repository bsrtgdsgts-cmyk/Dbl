<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Final Voxel Game</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial; }
#ui { position:fixed; top:10px; left:10px; color:white; z-index:10; }
#hotbar { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:5px; }
.slot { width:45px;height:45px;background:#222;color:white;display:flex;align-items:center;justify-content:center;border:1px solid #555;white-space:pre;cursor:pointer; }
</style>
</head>
<body>
<div id="ui">FINAL FIXED VERSION</div>
<div id="hotbar"></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { PointerLockControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

// =====================
// BASIC SETUP
// =====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new PointerLockControls(camera, document.body);
document.body.addEventListener("click", () => controls.lock());
scene.add(controls.getObject());

// LIGHT (IMPORTANT)
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(20, 40, 20);
scene.add(sun);

// START POSITION (CRITICAL FIX → avoids black screen)
controls.getObject().position.set(0, 10, 5);

// =====================
// BLOCK SYSTEM
// =====================
const blocks = [];

const mat = {
  grass: new THREE.MeshLambertMaterial({ color: 0x3cb043 }),
  dirt: new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
  stone: new THREE.MeshLambertMaterial({ color: 0x888888 }),
  wood: new THREE.MeshLambertMaterial({ color: 0x7a4a1c })
};

function block(x,y,z,type){
  const m = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat[type]);
  m.position.set(x,y,z);
  scene.add(m);
  blocks.push(m);
  return m;
}

// =====================
// WORLD GEN
// =====================
const size = 10;
const chunks = new Map();

function height(x,z){
  return Math.floor(Math.sin(x*0.15)*3 + Math.cos(z*0.15)*3);
}

function gen(cx,cz){
  const key = cx+","+cz;
  if(chunks.has(key)) return;
  chunks.set(key,true);

  for(let x=0;x<size;x++){
    for(let z=0;z<size;z++){
      const wx = cx*size+x;
      const wz = cz*size+z;
      const h = height(wx,wz);

      for(let y=0;y<=h;y++){
        let t = "stone";
        if(y===h) t="grass";
        else if(y>h-2) t="dirt";

        block(wx,y,wz,t);
      }
    }
  }
}

function updateWorld(){
  const p = controls.getObject().position;
  const cx = Math.floor(p.x/size);
  const cz = Math.floor(p.z/size);

  for(let x=-2;x<=2;x++){
    for(let z=-2;z<=2;z++){
      gen(cx+x, cz+z);
    }
  }
}

// =====================
// INVENTORY (FIXED ORDER)
// =====================
const inv = { grass:0, dirt:0, stone:0, wood:0 };
let selected = "grass";

const hotbar = document.getElementById("hotbar");

function updateHotbar(){
  hotbar.innerHTML = "";
  for(const k in inv){
    const d = document.createElement("div");
    d.className = "slot";
    d.innerText = k + "\n" + inv[k];
    d.onclick = () => selected = k;
    hotbar.appendChild(d);
  }
}
updateHotbar();

// =====================
// RAYCAST
// =====================
const ray = new THREE.Raycaster();

function hit(){
  ray.setFromCamera({x:0,y:0},camera);
  return ray.intersectObjects(blocks)[0];
}

document.addEventListener("mousedown",(e)=>{
  const h = hit();
  if(!h) return;

  if(e.button===0){
    inv.stone++;
    scene.remove(h.object);
    updateHotbar();
  }

  if(e.button===2){
    const p = h.object.position.clone().add(h.face.normal);
    block(p.x,p.y,p.z,selected);
  }
});

// =====================
// MOVEMENT
// =====================
const keys = {};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

function move(){
  if(keys.KeyW) controls.moveForward(0.15);
  if(keys.KeyS) controls.moveForward(-0.15);
  if(keys.KeyA) controls.moveRight(-0.15);
  if(keys.KeyD) controls.moveRight(0.15);
}

// =====================
// DEBUG (FOR SAFETY)
// =====================
const testCube = new THREE.Mesh(
  new THREE.BoxGeometry(2,2,2),
  new THREE.MeshBasicMaterial({ color: 0xff0000 })
);
testCube.position.set(0,5,0);
scene.add(testCube);

// =====================
// LOOP (SAFE)
// =====================
function animate(){
  requestAnimationFrame(animate);

  try { move(); } catch(e){}
  try { updateWorld(); } catch(e){}

  renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
